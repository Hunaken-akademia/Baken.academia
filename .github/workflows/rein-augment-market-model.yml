name: Publish validated REIN market augmentation
on:
  push:
    branches: [main]
    paths: [.github/workflows/rein-augment-market-model.yml]
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: rein-augment-market-model
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Download current production bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          path: .base
          github-token: ${{ github.token }}
          run-id: "36069608921"
      - name: Download validated real-odds models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: .market
          github-token: ${{ github.token }}
          run-id: "36135569462"
      - name: Build augmented immutable bundle
        run: |
          version="rein-role-v4-${GITHUB_SHA}"
          mkdir -p artifacts
          python scripts/augment_rein_bundle.py --base .base/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3.bundle.tar.gz --models .market --version "$version" --output "artifacts/$version.bundle.tar.gz" --manifest "artifacts/$version.bundle.manifest.json"
          echo "MODEL_VERSION=$version" >> "$GITHUB_ENV"
          echo "MODEL_BUNDLE=artifacts/$version.bundle.tar.gz" >> "$GITHUB_ENV"
          echo "MODEL_MANIFEST=artifacts/$version.bundle.manifest.json" >> "$GITHUB_ENV"
          printf '{"comparison":{}}\n' > artifacts/activation-metrics.json
          echo "MODEL_METRICS=artifacts/activation-metrics.json" >> "$GITHUB_ENV"
      - name: Upload and atomically activate augmented bundle
        run: bash scripts/upload_rein_model_to_supabase.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.MODEL_VERSION }}
          path: artifacts/
          retention-days: 30
