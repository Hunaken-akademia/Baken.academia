name: Import JRA analysis data to Supabase

on:
  push:
    branches: [main]
    paths:
      - .github/jra-supabase-import-request.json
      - .github/workflows/jra-supabase-import.yml
      - scripts/import_jra_analysis_to_supabase.py
      - scripts/download_supabase_archive.sh
      - scripts/download_jra_normalized_from_supabase.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: jra-supabase-analysis-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download durable JRA history
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
          tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
      - name: Download normalized JRA odds and payouts
        run: bash scripts/download_jra_normalized_from_supabase.sh .odds-normalized
      - name: Import into Supabase analysis tables
        run: python scripts/import_jra_analysis_to_supabase.py
