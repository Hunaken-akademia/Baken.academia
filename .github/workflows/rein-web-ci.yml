name: REIN web emergency deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download REIN history profile
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35489116818
          name: rein-history-profile-v2
          path: rein-web/data

      - name: Install dependencies
        working-directory: rein-web
        run: npm install

      - name: Build
        working-directory: rein-web
        run: npm run build

      - name: Test cache behavior
        working-directory: rein-web
        run: npm test

      - name: Test inference authorization
        working-directory: rein-web
        run: |
          python -m pip install 'PyJWT[crypto]==2.14.0'
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: rein-web
        run: |
          npx vercel link --yes --project rein-web --scope hunaken-akademia --token "$VERCEL_TOKEN"
          npx vercel deploy --prod --yes --scope hunaken-akademia --token "$VERCEL_TOKEN"

      - name: Explain skipped deployment
        if: env.VERCEL_TOKEN == ''
        run: echo "Build succeeded. Emergency deployment requires the existing VERCEL_TOKEN repository secret."
