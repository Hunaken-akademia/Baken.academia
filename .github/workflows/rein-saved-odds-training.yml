name: REIN saved real-win-odds retraining

on:
  push:
    branches: [analysis/jra-blend-top5-20260925]
    paths: [.github/workflows/rein-saved-odds-training.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: rein-saved-odds-training-20260925
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1 lightgbm==4.7.0 scipy==1.17.1 scikit-learn==1.9.1
      - name: Run temporal and ranking regression tests
        run: |
          python -m unittest discover -s tests -p test_rein_blend_top5_audit.py -v
          python -m unittest discover -s scripts -p test_rein_market_edge.py -v
          python -m unittest discover -s scripts -p test_rein_real_odds_retrain.py -v
      - name: Download existing 2019-2025 February odds release from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .odds-archives
          gh release download jra-final-odds-2019-2025-02-v1 --repo "$GITHUB_REPOSITORY" --pattern 'jra-final-odds-*.tar.gz' --dir .odds-archives
      - name: Download existing 2025 March-2026 odds artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: jra-final-odds-*
          path: .odds-archives
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: "35419708495"
      - name: Download verified historical input and frozen production models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          path: .frozen-input
          github-token: ${{ github.token }}
          run-id: "36069608921"
      - name: Verify saved odds checksums and rebuild point-in-time features
        run: |
          mkdir -p .frozen
          tar --no-same-owner -xzf .frozen-input/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3.bundle.tar.gz -C .frozen
          python scripts/rein_saved_win_odds_retrain.py --bundle-root .frozen/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3 --odds-dir .odds-archives --output .prepared
          mkdir -p artifacts/rein-saved-odds-training
          cp .prepared/coverage.json .prepared/archive_audit.json .prepared/parity.json artifacts/rein-saved-odds-training/
      - name: Train first-place real-win-odds models
        run: python scripts/rein_real_odds_retrain.py train --role first --data-dir .prepared --output artifacts/rein-saved-odds-training/first
      - name: Train second-place real-win-odds models
        run: python scripts/rein_real_odds_retrain.py train --role second --data-dir .prepared --output artifacts/rein-saved-odds-training/second
      - name: Train third-place real-win-odds models
        run: python scripts/rein_real_odds_retrain.py train --role third --data-dir .prepared --output artifacts/rein-saved-odds-training/third
      - name: Preserve research outputs only; no production activation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: artifacts/rein-saved-odds-training
          if-no-files-found: warn
          retention-days: 30
