name: REIN Top4 splice definition audit
on:
  push:
    branches: [analysis/jra-blend-top5-20260925]
    paths: [.github/workflows/rein-top4-tail-definition-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: rein-top4-tail-definition-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1
      - name: Read preserved real-odds research predictions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: .new
          github-token: ${{ github.token }}
          run-id: "36135569462"
      - name: Read frozen production predictions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-jra-top5-audit-20260925
          path: .old
          github-token: ${{ github.token }}
          run-id: "36126760897"
      - name: Verify baselines and compute fixed splice without fitting
        run: python scripts/rein_top4_tail_definition_audit.py
      - name: Preserve diagnostic results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rein-top4-tail-definition-audit
          path: artifacts/top4-tail-definition
          retention-days: 30
          if-no-files-found: warn
