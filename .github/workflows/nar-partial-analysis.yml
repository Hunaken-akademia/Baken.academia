name: NAR rolling partial analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/nar-partial-analysis-request.json
      - .github/workflows/nar-partial-analysis.yml
      - scripts/nar_partial_analysis.py
      - scripts/nar_live_model.py
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["NAR licensed eight-year backfill with all final odds"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: nar-rolling-partial-analysis-v1
  # New chunks can arrive while downloading previous ones. Let the current
  # analysis finish; GitHub keeps only the latest pending follow-up.
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download every completed NAR archive currently in Supabase
        id: archives
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .nar-archives .nar-dataset

          oidc_token=""
          oidc_refreshed_at=0
          refresh_oidc_token() {
            local now token_response
            now="$(date +%s)"
            if [[ -n "${oidc_token}" ]] && (( now - oidc_refreshed_at < 240 )); then return; fi
            token_response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rein-supabase-archive-v1")"
            oidc_token="$(jq -er '.value' <<<"${token_response}")"
            oidc_refreshed_at="${now}"
          }

          python scripts/plan_nar_resume.py >/tmp/nar-plan.log
          python - <<'PY' > /tmp/nar-periods.txt
          from scripts.plan_nar_resume import build_periods
          for p in build_periods():
              print(f"{p['year']} {p['period']}")
          PY

          completed=0
          while read -r year period; do
            refresh_oidc_token
            path="nar/archive/all-bets/v2/${year}/${period}.tar.gz"
            payload="$(jq -nc --arg path "${path}" '{action:"exists",path:$path}')"
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -X POST "${SUPABASE_BROKER_URL}" \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              --data "${payload}")"
            exists="$(jq -r '.exists // false' <<<"${response}")"
            if [[ "${exists}" != "true" ]]; then
              continue
            fi

            refresh_oidc_token
            payload="$(jq -nc --arg path "${path}" '{action:"sign-download",path:$path}')"
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -X POST "${SUPABASE_BROKER_URL}" \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              --data "${payload}")"
            signed_url="$(jq -er '.signed_url' <<<"${response}")"
            archive=".nar-archives/${period}.tar.gz"
            curl --fail-with-body --silent --show-error --retry 3 "${signed_url}" -o "${archive}"
            tar --no-same-owner -xzf "${archive}" -C .nar-dataset
            completed=$((completed + 1))
          done < /tmp/nar-periods.txt

          echo "Completed NAR chunks downloaded: ${completed}"
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"

      - name: Report that corrected archives are not ready yet
        if: steps.archives.outputs.completed == '0'
        run: |
          echo "## NAR修正版データ待機中" >> "${GITHUB_STEP_SUMMARY}"
          echo "v2チャンクがまだ完成していないため、今回は正常終了します。" >> "${GITHUB_STEP_SUMMARY}"

      - name: Analyze acquired NAR data
        if: steps.archives.outputs.completed != '0'
        run: >-
          python scripts/nar_partial_analysis.py
          --input-dir .nar-dataset
          --output-dir artifacts/nar-partial-analysis

      - name: Publish summary
        if: steps.archives.outputs.completed != '0'
        shell: bash
        run: cat artifacts/nar-partial-analysis/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish latest partial NAR analysis to REIN
        if: steps.archives.outputs.completed != '0'
        shell: bash
        env:
          SUPABASE_SERVER_DATA_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/rein-server-data"
        run: |
          set -Eeuo pipefail
          token_response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rein-supabase-archive-v1")"
          oidc_token="$(jq -er '.value' <<<"${token_response}")"
          profile=artifacts/nar-partial-analysis/nar-history-profile.json.gz
          digest="$(sha256sum "$profile" | cut -d' ' -f1)"
          payload="$(jq -nc --arg sha "$digest" '{action:"nar-profile-upload",sha:$sha}')"
          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$SUPABASE_SERVER_DATA_URL" -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" --data "$payload")"
          upload_url="$(jq -er '.signed_url' <<<"$response")"
          curl --fail-with-body --silent --show-error --retry 3 -X PUT "$upload_url" \
            -H 'Content-Type: application/gzip' --data-binary "@$profile"
          payload="$(jq -nc --arg sha "$digest" --slurpfile report artifacts/nar-partial-analysis/report.json \
            '{action:"publish-nar-analysis",report:($report[0] + {profileSha:$sha})}')"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "${SUPABASE_SERVER_DATA_URL}" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${payload}"

      - name: Remove temporary combined parquet before artifact upload
        if: steps.archives.outputs.completed != '0'
        run: rm -f artifacts/nar-partial-analysis/nar-partial-combined.parquet

      - uses: actions/upload-artifact@v4
        if: steps.archives.outputs.completed != '0'
        with:
          name: nar-partial-analysis-v2
          path: artifacts/nar-partial-analysis
          if-no-files-found: error
          retention-days: 90
