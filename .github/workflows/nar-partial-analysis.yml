name: NAR rolling partial analysis
# Historical recall retries refresh authentication per archive.

on:
  workflow_dispatch:
    inputs:
      audit_second_third:
        description: 'Research only: audit second-place support for third-place ranking'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/nar-partial-analysis-request.json
      - .github/workflows/nar-partial-analysis.yml
      - scripts/nar_partial_analysis.py
      - scripts/nar_live_model.py
      - scripts/nar_full_revalidation.py
      - scripts/nar_condition_validation.py
      - reports/nar-current-release-model-20260928.json
  schedule:
    # Monday 04:17 JST; daily archives and live snapshots remain independent.
    - cron: "17 19 * * 0"
  workflow_run:
    workflows: ["NAR licensed eight-year backfill with all final odds", "NAR licensed eight-year results backfill"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: nar-rolling-partial-analysis-v1
  # New chunks can arrive while downloading previous ones. Let the current
  # analysis finish; GitHub keeps only the latest pending follow-up.
  cancel-in-progress: false

jobs:
  analyze:
    if: "!contains(github.event.head_commit.message, '[eight-year-recall]') && !contains(github.event.head_commit.message, '[accuracy-experiments]') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPPORT_AUDIT_ONLY: ${{ inputs.audit_second_third == true || contains(github.event.head_commit.message, '[second-third-support-audit]') }}
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download every completed NAR archive currently in Supabase
        id: archives
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .nar-archives .nar-dataset

          oidc_token=""
          oidc_refreshed_at=0
          refresh_oidc_token() {
            local now token_response
            now="$(date +%s)"
            if [[ -n "${oidc_token}" ]] && (( now - oidc_refreshed_at < 240 )); then return; fi
            token_response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rein-supabase-archive-v1")"
            oidc_token="$(jq -er '.value' <<<"${token_response}")"
            oidc_refreshed_at="${now}"
          }

          python scripts/plan_nar_resume.py >/tmp/nar-plan.log
          python - <<'PY' > /tmp/nar-periods.txt
          from scripts.plan_nar_resume import build_periods
          for p in build_periods():
              print(f"{p['year']} {p['period']}")
          PY

          completed=0
          while read -r year period; do
            refresh_oidc_token
            path="nar/archive/all-bets/v2/${year}/${period}.tar.gz"
            payload="$(jq -nc --arg path "${path}" '{action:"exists",path:$path}')"
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -X POST "${SUPABASE_BROKER_URL}" \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              --data "${payload}")"
            exists="$(jq -r '.exists // false' <<<"${response}")"
            if [[ "${exists}" != "true" ]]; then
              continue
            fi

            refresh_oidc_token
            payload="$(jq -nc --arg path "${path}" '{action:"sign-download",path:$path}')"
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -X POST "${SUPABASE_BROKER_URL}" \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              --data "${payload}")"
            signed_url="$(jq -er '.signed_url' <<<"${response}")"
            archive=".nar-archives/${period}.tar.gz"
            curl --fail-with-body --silent --show-error --retry 3 "${signed_url}" -o "${archive}"
            if [[ "$completed" == 0 ]]; then
              tar -tzf "${archive}" > /tmp/nar-archive-members.txt
              echo "First archive raw HTML cache count: $(grep -c 'html.gz$' /tmp/nar-archive-members.txt || true)"
              head -20 /tmp/nar-archive-members.txt
            fi
            # Legacy archives include duplicate events and unused odds tables.
            tar --no-same-owner --wildcards --no-anchored --exclude='*-odds-*' --exclude='*-payouts*' --exclude='*-manifest*' -xzf "${archive}" -C .nar-dataset 'nar-*.parquet'
            completed=$((completed + 1))
          done < /tmp/nar-periods.txt

          echo "Completed NAR chunks downloaded: ${completed}"
          echo "completed=${completed}" >> "${GITHUB_OUTPUT}"

      - name: Report that corrected archives are not ready yet
        if: steps.archives.outputs.completed == '0'
        run: |
          echo "## NAR修正版データ待機中" >> "${GITHUB_STEP_SUMMARY}"
          echo "v2チャンクがまだ完成していないため、今回は正常終了します。" >> "${GITHUB_STEP_SUMMARY}"

      - name: Analyze acquired NAR data
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        run: >-
          python scripts/nar_partial_analysis.py
          --input-dir .nar-dataset
          --output-dir artifacts/nar-partial-analysis

      - name: Publish summary
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        shell: bash
        run: cat artifacts/nar-partial-analysis/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate venue weights and reference signals
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: >-
          python scripts/nar_condition_validation.py
          --input-file artifacts/nar-partial-analysis/nar-partial-combined.parquet
          --output-dir artifacts/nar-partial-analysis

      - name: Publish condition validation summary
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        run: cat artifacts/nar-partial-analysis/condition-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish latest partial NAR analysis to REIN
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        shell: bash
        env:
          SUPABASE_SERVER_DATA_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/rein-server-data"
        run: |
          set -Eeuo pipefail
          token_response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rein-supabase-archive-v1")"
          oidc_token="$(jq -er '.value' <<<"${token_response}")"
          profile=artifacts/nar-partial-analysis/nar-history-profile.json.gz
          digest="$(sha256sum "$profile" | cut -d' ' -f1)"
          payload="$(jq -nc --arg sha "$digest" '{action:"nar-profile-upload",sha:$sha}')"
          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$SUPABASE_SERVER_DATA_URL" -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" --data "$payload")"
          upload_url="$(jq -er '.signed_url' <<<"$response")"
          curl --fail-with-body --silent --show-error --retry 3 -X PUT "$upload_url" \
            -H 'Content-Type: application/gzip' --data-binary "@$profile"
          payload="$(jq -nc --arg sha "$digest" --slurpfile report artifacts/nar-partial-analysis/report.json \
            '{action:"publish-nar-analysis",report:($report[0] + {profileSha:$sha})}')"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "${SUPABASE_SERVER_DATA_URL}" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${payload}"

      - name: Revalidate frozen NAR release against full data
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        run: >-
          python scripts/nar_full_revalidation.py
          --input-file artifacts/nar-partial-analysis/nar-partial-combined.parquet
          --frozen-release reports/nar-current-release-model-20260928.json
          --output-dir artifacts/nar-partial-analysis/full-revalidation

      - name: Publish full revalidation summary
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        shell: bash
        run: cat artifacts/nar-partial-analysis/full-revalidation/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary combined parquet before artifact upload
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        run: rm -f artifacts/nar-partial-analysis/nar-partial-combined.parquet

      - uses: actions/upload-artifact@v4
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY != 'true'
        with:
          name: nar-partial-analysis-v2
          path: artifacts/nar-partial-analysis
          if-no-files-found: error
          retention-days: 14

      - name: Audit second-place support without publishing a model
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY == 'true'
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: >-
          python scripts/audit_second_third_support.py
          --league nar --input-dir .nar-dataset
          --output-dir artifacts/second-third-support-audit

      - uses: actions/upload-artifact@v4
        if: steps.archives.outputs.completed != '0' && env.SUPPORT_AUDIT_ONLY == 'true'
        with:
          name: nar-second-third-support-audit
          path: artifacts/second-third-support-audit
          if-no-files-found: error
          retention-days: 14

  eight-year-recall:
    if: contains(github.event.head_commit.message, '[eight-year-recall]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: rein-role-v4-f09ba60f2141dda639c667423b1a07eec73eb0dc
          path: .second-third-audit/jra
          github-token: ${{ github.token }}
          run-id: "36202792464"
      - name: Extract frozen JRA model and full history
        run: |
          tar --no-same-owner -xzf .second-third-audit/jra/*.bundle.tar.gz -C .second-third-audit/jra
          python -m py_compile scripts/rein_eight_year_recall.py
      - name: Download all 186 saved NAR periods with refreshed authentication
        run: python scripts/download_recall_archives.py
      - name: Compute all-years exact-place recall
        run: python scripts/rein_eight_year_recall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rein-eight-year-recall-20261001
          path: artifacts/rein-eight-year
          retention-days: 30


  accuracy-experiments:
    if: contains(github.event.head_commit.message, '[accuracy-experiments]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read saved NAR archives
        run: python scripts/download_recall_archives.py
      - name: Fit and compare odds-independent candidates without publishing
        run: python -u scripts/rein_accuracy_experiments.py --league nar --output-dir artifacts/rein-accuracy-nar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rein-accuracy-nar-20261005
          path: artifacts/rein-accuracy-nar
          if-no-files-found: warn
          retention-days: 30
