name: REIN current-model Top5 mixture audit

on:
  push:
    branches: [analysis/jra-blend-top5-20260925]
    paths:
      - .github/workflows/rein-blend-top5-audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: rein-jra-top5-audit-20260925
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download verified current model bundle with complete history
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          path: .frozen-input
          github-token: ${{ github.token }}
          run-id: "36069608921"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1 lightgbm==4.7.0 scipy==1.17.1
      - name: Verify temporal and ranking unit tests
        run: python -m unittest discover -s tests -p test_rein_blend_top5_audit.py -v
      - name: Extract frozen immutable model and historical input
        run: |
          mkdir -p .frozen
          tar --no-same-owner -xzf .frozen-input/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3.bundle.tar.gz -C .frozen
      - name: Check production parity and evaluate all 21 mixtures
        run: >-
          python scripts/rein_blend_top5_audit.py
          --bundle-root .frozen/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          --output artifacts/rein-jra-top5-audit-20260925
      - name: Preserve report and diagnostic checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rein-jra-top5-audit-20260925
          path: artifacts/rein-jra-top5-audit-20260925
          if-no-files-found: warn
          retention-days: 30
