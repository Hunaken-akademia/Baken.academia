name: Stop NAR catch-up
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stop-nar-catchup.yml
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel additional catch-up run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36251291777 --repo Hunaken-akademia/Baken.academia
