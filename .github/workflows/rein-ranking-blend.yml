name: REIN market blend evaluation

on:
  push:
    branches: [main]
    paths: [.github/rein-ranking-blend-request.json]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
      OIDC_AUDIENCE: "rein-supabase-model-v1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_ranking_quality tests.test_ranking_blend -v
      - name: Download durable licensed JRA history from Supabase
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
      - run: tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
      - name: Download held-out REIN predictions
        uses: actions/download-artifact@v4
        with:
          name: jra-history-v2-model
          path: .model
          github-token: ${{ github.token }}
          run-id: "35417574150"
      - name: Tune on pre-2026 and evaluate on 2026
        run: >-
          python -m baken_academia.ranking_blend
          --predictions .model/test_predictions.parquet
          --races data/raw/jra/races-2019-2026.parquet
          --output artifacts/rein-ranking-blend-v1
      - name: Publish summary
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/rein-ranking-blend-v1/report.json").read_text())
          policy = report["selection_policy"]
          data = report["test_2026"]
          labels = {"hybrid": "人気＋REIN", "popularity": "人気順", "rein": "REIN単独"}
          lines = [
              "## REIN 人気ハイブリッド順位検証",
              "",
              f"- 1着候補のREIN比率: {policy['first_alpha']:.0%}",
              f"- トップ3候補のREIN比率: {policy['top3_alpha']:.0%}",
              "- 比率は2026年より前だけで選び、2026年は最終確認専用",
              "",
              "|方式|評価1位1着率|評価1位3着内率|トップ3内に勝ち馬|トップ3から2頭以上3着内|トップ3全頭3着内|",
              "|---|---:|---:|---:|---:|---:|",
          ]
          for method, label in labels.items():
              row = data[method]["race_level"]
              lines.append(
                  f"|{label}|{row['top1_win_rate']:.2%}|{row['top1_top3_rate']:.2%}|"
                  f"{row['top3_contains_winner_rate']:.2%}|"
                  f"{row['top3_two_or_more_placed_rate']:.2%}|{row['top3_all_placed_rate']:.2%}|"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: rein-ranking-blend-v1
          path: artifacts/rein-ranking-blend-v1
          retention-days: 90
