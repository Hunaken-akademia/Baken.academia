name: Build and publish REIN role model

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "JRA result backfill workflow run ID"
        required: true
        default: "35414533165"
  workflow_run:
    workflows: ["REIN daily race capture"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/jra-cushion-research-request.json"
      - "scripts/rein_ticket_research_v4.py"
      - "scripts/rein_research.py"
      - "scripts/rein_research_v3.py"
      - "scripts/build_rein_role_bundle.py"
      - "scripts/refresh_rein_history.py"
      - "tests/test_rein_history_retry.py"
      - "scripts/upload_rein_model_to_supabase.sh"
      - "src/baken_academia/features.py"
      - "src/baken_academia/history_features.py"
      - ".github/workflows/rein-role-model-to-supabase.yml"
      - "supabase/functions/github-rein-model/**"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[cushion-research]') && 'rein-cushion-research' || contains(github.event.head_commit.message, '[graded-trends]') && 'rein-graded-trends' || 'rein-role-model-to-supabase' }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event_name != 'workflow_run' && !contains(github.event.head_commit.message, '[cushion-research]') && !contains(github.event.head_commit.message, '[graded-trends]') && !contains(github.event.head_commit.message, '[history-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
      OIDC_AUDIENCE: "rein-supabase-model-v1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Download durable licensed JRA history from Supabase
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
      - name: Train exact role models
        shell: bash
        run: |
          tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
          history="data/raw/jra/races-2019-2026.parquet"
          export REIN_HISTORY_PATH="${history}"
          export REIN_MODEL_DIR="artifacts/rein-role-model-v4"
          export REIN_TRAIN_ONLY=1
          python scripts/rein_ticket_research_v4.py
          version="rein-role-v4-${GITHUB_SHA}"
          bundle="artifacts/rein-role-model-v4/${version}.bundle.tar.gz"
          python scripts/build_rein_role_bundle.py \
            --history "${history}" --model-dir "${REIN_MODEL_DIR}" \
            --output "${bundle}" --version "${version}" \
            --source-commit "${GITHUB_SHA}" \
            --metrics reports/rein-ticket-research-v4/report.json \
            > artifacts/rein-role-model-v4/build-result.json
          echo "MODEL_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "MODEL_BUNDLE=${bundle}" >> "${GITHUB_ENV}"
          echo "MODEL_MANIFEST=${bundle%.bundle.tar.gz}.bundle.manifest.json" >> "${GITHUB_ENV}"
          echo "MODEL_METRICS=reports/rein-ticket-research-v4/report.json" >> "${GITHUB_ENV}"
      - name: Upload and atomically activate in Supabase
        run: bash scripts/upload_rein_model_to_supabase.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODEL_VERSION }}
          path: |
            ${{ env.MODEL_BUNDLE }}
            ${{ env.MODEL_MANIFEST }}
            artifacts/rein-role-model-v4/build-result.json
          retention-days: 30


  refresh-history:
    if: contains(github.event.head_commit.message, '[history-refresh]') || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    # Sire lookups from past race cards catch up within a daily budget (one page
    # per 3-4 s); afterwards only new horses are fetched.
    timeout-minutes: 330
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
      JRA_PEDIGREE_BUDGET_MINUTES: "290"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify transient read recovery
        run: python -m pytest -q tests/test_rein_history_retry.py
      - name: Add completed races while preserving model coefficients
        id: refresh
        run: python -u scripts/refresh_rein_history.py
      - name: Publish updated immutable history bundle
        if: steps.refresh.outputs.changed == 'true'
        run: bash scripts/upload_rein_model_to_supabase.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rein-history-refresh-${{ github.run_id }}
          path: artifacts/rein-history-refresh/summary.json
          if-no-files-found: warn
          retention-days: 30

  cushion-research:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[cushion-research]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
      OIDC_AUDIENCE: "rein-supabase-model-v1"
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber==0.11.9
      - run: python -m pytest tests/test_track_conditions.py tests/test_nar_track_research.py -q
      - name: Read licensed history without publishing a model
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
          tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
      - name: Collect official daily cushion and moisture PDFs
        run: python scripts/collect_track_conditions.py --output artifacts/jra-cushion/source --start-year 2018 --end-year 2026
      - name: Compare chronological holdouts
        run: python scripts/analyze_jra_cushion.py --history data/raw/jra/races-2019-2026.parquet --measurements artifacts/jra-cushion/source/measurements.json --output artifacts/jra-cushion
      - run: cat artifacts/jra-cushion/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jra-cushion-research-${{ github.run_id }}
          path: artifacts/jra-cushion
          retention-days: 90
          if-no-files-found: error

  graded-trends:
    # Read-only: builds the graded-race trend cards for the web app as an artifact.
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[graded-trends]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-rein-model"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
      OIDC_AUDIENCE: "rein-supabase-model-v1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_build_graded_trends.py
      - name: Read licensed history and the active sire table
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
          tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
          python scripts/fetch_active_pedigree.py .dataset/pedigree.json
      - name: Choose the collected pre-2019 results, if any
        id: older
        run: echo "run=$(jq -r '.olderHistoryRunId // empty' .github/graded-trends-sources.json)" >> "$GITHUB_OUTPUT"
      - if: steps.older.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: jra-history-2015-2018
          path: .dataset/older
          github-token: ${{ github.token }}
          run-id: ${{ steps.older.outputs.run }}
      - name: Build graded-race trends
        run: |
          older=(); minutes=0
          if [ -f .dataset/older/races-before-2019.parquet ]; then older=(--older-history .dataset/older/races-before-2019.parquet); minutes=200; fi
          python - <<'PY'
          import sys; sys.path.insert(0, 'scripts')
          from pathlib import Path
          from build_graded_trends import fetch_grade_pages
          fetch_grade_pages(range(2015, 2027), Path('.jra-grades'))
          PY
          python scripts/build_graded_trends.py \
            --history data/raw/jra/races-2019-2026.parquet "${older[@]}" \
            --reference rein-web/lib/jra-condition-reference.json \
            --pedigree .dataset/pedigree.json --grade-dir .jra-grades --pedigree-minutes "$minutes" \
            --through-year 2025 \
            --output artifacts/jra-graded-trends.json
      - uses: actions/upload-artifact@v4
        with:
          name: jra-graded-trends-v1
          path: artifacts/jra-graded-trends.json
          retention-days: 90
          if-no-files-found: error
