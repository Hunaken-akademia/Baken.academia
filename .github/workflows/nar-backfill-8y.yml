name: NAR licensed eight-year backfill with all final odds

on:
  push:
    branches: [main]
    paths:
      - .github/nar-backfill-8y-request.json
      - .github/workflows/nar-backfill-8y.yml
      - scripts/plan_nar_resume.py
      - scripts/check_supabase_archive.sh
      - scripts/upload_archive_to_supabase.sh
      - src/baken_academia/nar_backfill.py
      - tests/test_odds_resume.py

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: nar-licensed-eight-year-backfill-v2
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.periods.outputs.matrix }}
      count: ${{ steps.periods.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: periods
        run: python scripts/plan_nar_resume.py

  backfill:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      YEAR: ${{ matrix.year }}
      MONTH: ${{ matrix.month }}
      MONTH_PADDED: ${{ matrix.month_padded }}
      START_DAY: ${{ matrix.start_day }}
      END_DAY: ${{ matrix.end_day }}
      SUFFIX: ${{ matrix.suffix }}
      PERIOD: ${{ matrix.period }}
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      ARCHIVE_DATASET: "nar-results-all-bet-types-odds-and-payouts-v2"
    steps:
      - uses: actions/checkout@v4
      - id: archive
        name: Skip if verified archive already exists in Supabase
        run: |
          export ARCHIVE_OBJECT_PATH="nar/archive/all-bets/v2/${YEAR}/${PERIOD}.tar.gz"
          bash scripts/check_supabase_archive.sh
      - uses: actions/setup-python@v5
        if: steps.archive.outputs.exists != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.archive.outputs.exists != 'true'
        run: pip install -r requirements.txt
      - if: steps.archive.outputs.exists != 'true'
        run: python -m unittest discover -s tests -v
      - name: Backfill NAR results, all final odds and payouts
        if: steps.archive.outputs.exists != 'true'
        run: >-
          python -m baken_academia.nar_backfill
          --year "$YEAR" --month "$MONTH"
          --start-day "$START_DAY" --end-day "$END_DAY"
          --output "data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}.parquet"
          --min-delay 3 --max-delay 4
          --permission-confirmed --continue-on-error
      - name: Package verified NAR archive
        if: steps.archive.outputs.exists != 'true'
        run: |
          tar -czf "nar-${PERIOD}.tar.gz" \
            data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}*.parquet \
            "data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}.audit.json" \
            "data/raw/nar/events/${YEAR}/${MONTH_PADDED}" \
            "data/raw/nar/odds-pages/${YEAR}/${MONTH_PADDED}"
          test -s "nar-${PERIOD}.tar.gz"
      - name: Archive verified chunk directly to Supabase
        if: steps.archive.outputs.exists != 'true'
        run: |
          export ARCHIVE_FILE="nar-${PERIOD}.tar.gz"
          export ARCHIVE_OBJECT_PATH="nar/archive/all-bets/v2/${YEAR}/${PERIOD}.tar.gz"
          bash scripts/upload_archive_to_supabase.sh
      - name: Request rolling NAR analysis after a new chunk
        if: steps.archive.outputs.exists != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nar-partial-analysis.yml --ref main
