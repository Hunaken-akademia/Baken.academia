name: NAR licensed eight-year results backfill

on:
  workflow_dispatch:
    inputs:
      replace_running:
        description: "現在の同バックフィルを置き換える"
        type: boolean
        required: false
        default: false
      auto_retry_attempt:
        description: "失敗チャンク自動再処理の試行回数"
        type: number
        required: false
        default: 0
  push:
    branches: [main]
    # Code changes do not interrupt an active multi-day backfill.
    # Editing the request file explicitly restarts from completed archives.
    paths:
      - .github/nar-backfill-8y-request.json

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: nar-licensed-eight-year-backfill-v2
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.replace_running }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.periods.outputs.matrix }}
      count: ${{ steps.periods.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate the collector once before starting the matrix
        run: python -m unittest discover -s tests -v
      - id: periods
        run: python scripts/plan_nar_resume.py

  backfill:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      YEAR: ${{ matrix.year }}
      MONTH: ${{ matrix.month }}
      MONTH_PADDED: ${{ matrix.month_padded }}
      START_DAY: ${{ matrix.start_day }}
      END_DAY: ${{ matrix.end_day }}
      SUFFIX: ${{ matrix.suffix }}
      PERIOD: ${{ matrix.period }}
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      ARCHIVE_DATASET: "nar-all-bet-odds-v1"
    steps:
      - uses: actions/checkout@v4
      - id: archive
        name: Skip if verified archive already exists in Supabase
        run: |
          # Resume full-odds archives; results-only v2 archives are not completeness evidence.
          export ARCHIVE_OBJECT_PATH="nar/archive/all-bets/v1/${YEAR}/${PERIOD}.tar.gz"
          bash scripts/check_supabase_archive.sh
      - uses: actions/setup-python@v5
        if: steps.archive.outputs.exists != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.archive.outputs.exists != 'true'
        run: pip install -r requirements.txt
      - name: Fetch NAR results and all final bet odds
        if: steps.archive.outputs.exists != 'true'
        run: >-
          python -m baken_academia.nar_backfill
          --year "$YEAR" --month "$MONTH"
          --start-day "$START_DAY" --end-day "$END_DAY"
          --output "data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}.parquet"
          --min-delay 3 --max-delay 3
          --permission-confirmed --continue-on-error --include-all-bet-odds
      - name: Package verified NAR result archive
        if: steps.archive.outputs.exists != 'true' && env.ARCHIVE_DATASET == 'nar-results-win-odds-popularity-v3'
        run: |
          tar -czf "nar-${PERIOD}.tar.gz" "data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}.parquet" "data/raw/nar/nar-${YEAR}-${MONTH_PADDED}-${SUFFIX}.audit.json"
          test -s "nar-${PERIOD}.tar.gz"
      - name: Package verified NAR all-bet archive
        if: steps.archive.outputs.exists != 'true'
        run: |
          python -c 'import json, os; from pathlib import Path; p=Path("data/raw/nar") / ("nar-"+os.environ["YEAR"]+"-"+os.environ["MONTH_PADDED"]+"-"+os.environ["SUFFIX"]+".audit.json"); a=json.loads(p.read_text()); assert a["all_bet_odds_requested"] and not a["errors"] and not a["odds_errors"]; assert a["odds_pages"] == a["races"] * len(a["bet_types"]), a'
          tar -czf "nar-${PERIOD}.tar.gz" data/raw/nar/*.parquet data/raw/nar/*.audit.json data/raw/nar/odds-pages data/raw/nar/events
          test -s "nar-${PERIOD}.tar.gz"
      - name: Archive verified chunk directly to Supabase
        if: steps.archive.outputs.exists != 'true'
        run: |
          export ARCHIVE_FILE="nar-${PERIOD}.tar.gz"
          export ARCHIVE_OBJECT_PATH="nar/archive/all-bets/v1/${YEAR}/${PERIOD}.tar.gz"
          bash scripts/upload_archive_to_supabase.sh
      - name: Request rolling NAR analysis after a new chunk
        if: steps.archive.outputs.exists != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nar-partial-analysis.yml --ref main


  finalize:
    needs: [plan, backfill]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_ATTEMPT: ${{ inputs.auto_retry_attempt || 0 }}
      BACKFILL_RESULT: ${{ needs.backfill.result }}
    steps:
      - name: Retry only incomplete chunks through Supabase resume checks
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${BACKFILL_RESULT}" == "success" ]]; then
            echo "All matrix jobs completed. The workflow_run analysis trigger will start the full analysis."
            exit 0
          fi

          current="${CURRENT_ATTEMPT:-0}"
          if (( current >= 3 )); then
            echo "::error::Incomplete NAR chunks remain after 3 automatic retry runs."
            exit 1
          fi

          next=$((current + 1))
          echo "Dispatching automatic retry ${next}/3. Existing Supabase archives will be verified and skipped."
          gh workflow run nar-backfill-8y.yml --ref main -f auto_retry_attempt="${next}"
