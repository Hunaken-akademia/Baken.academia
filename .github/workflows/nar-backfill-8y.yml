name: NAR licensed eight-year backfill (paused)

on:
  push:
    branches: [main]
    paths:
      - .github/nar-backfill-8y-request.json

permissions:
  contents: read

concurrency:
  group: nar-licensed-eight-year-backfill-v2
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Keep NAR backfill paused while JRA odds is prioritized
        run: echo "NAR backfill paused after durable 2019-01 through 2019-04 artifacts."
