name: JRA all bet types odds and payouts backfill

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["JRA licensed final odds remaining eight years"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: jra-all-bet-types-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      periods: ${{ steps.periods.outputs.periods }}
    steps:
      - id: periods
        shell: python
        run: |
          import calendar, json, os
          from datetime import date
          periods = []
          year, month = 2019, 1
          while (year, month) <= (2026, 9):
              start = date(year, month, 1)
              end = date(year, month, calendar.monthrange(year, month)[1])
              if end > date(2026, 9, 18):
                  end = date(2026, 9, 18)
              periods.append({"name": f"{year}-{month:02d}",
                              "start": start.isoformat(), "end": end.isoformat()})
              month += 1
              if month == 13:
                  year, month = year + 1, 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("periods=" + json.dumps(periods, separators=(",", ":")) + "\n")

  collect:
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        period: ${{ fromJSON(needs.plan.outputs.periods) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Download JRA race history
        uses: actions/download-artifact@v4
        with:
          name: jra-backfill-2019-2026
          path: .dataset
          github-token: ${{ github.token }}
          run-id: "35414533165"
      - run: tar -xzf .dataset/jra-backfill-result.tar.gz
      - name: Collect every standard bet type
        run: >-
          python -m baken_academia.jra_all_odds_backfill
          --input data/raw/jra/races-2019-2026.parquet
          --start-date ${{ matrix.period.start }} --end-date ${{ matrix.period.end }}
          --output-dir data/raw/jra-all-odds/normalized
          --work-dir data/raw/jra-all-odds
          --min-delay 3 --max-delay 4
          --permission-confirmed --continue-on-error
      - name: Package raw pages and normalized data
        if: always()
        run: tar -czf jra-all-odds-${{ matrix.period.name }}.tar.gz data/raw/jra-all-odds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-all-odds-${{ matrix.period.name }}
          path: jra-all-odds-${{ matrix.period.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90
