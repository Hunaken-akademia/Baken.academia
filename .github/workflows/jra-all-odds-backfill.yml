name: JRA all bet types odds and payouts backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jra-all-odds-backfill.yml"
  workflow_run:
    workflows: ["JRA licensed final odds remaining eight years"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: jra-all-bet-types-backfill
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      periods: ${{ steps.periods.outputs.periods }}
      count: ${{ steps.periods.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Check durable race-page index
        run: test -s data/indices/jra-race-pages-2019-2026.csv
      - id: periods
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/plan_all_odds_resume.py

  collect:
    needs: plan
    if: >-
      needs.plan.outputs.count != '0' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        period: ${{ fromJSON(needs.plan.outputs.periods) }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Prepare durable race-page index
        run: >-
          python -c "import pandas as pd;
          pd.read_csv('data/indices/jra-race-pages-2019-2026.csv').to_parquet('race-pages.parquet', index=False)"
      - name: Collect every standard bet type
        run: >-
          python -m baken_academia.jra_all_odds_backfill
          --input race-pages.parquet
          --start-date ${{ matrix.period.start }} --end-date ${{ matrix.period.end }}
          --output-dir data/raw/jra-all-odds/normalized
          --work-dir data/raw/jra-all-odds
          --min-delay 3 --max-delay 4
          --permission-confirmed --continue-on-error
      - name: Package raw pages and normalized data
        run: |
          tar -czf jra-all-odds-${{ matrix.period.name }}.tar.gz data/raw/jra-all-odds
          python scripts/validate_jra_archive.py jra-all-odds-${{ matrix.period.name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jra-all-odds-${{ matrix.period.name }}
          path: jra-all-odds-${{ matrix.period.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90
