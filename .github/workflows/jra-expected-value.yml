name: JRA licensed final odds and expected value (paused)

on:
  push:
    branches: [main]
    paths:
      - .github/jra-expected-value-request.json

permissions:
  contents: read

concurrency:
  group: jra-licensed-final-odds
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm duplicate JRA odds run is paused
        run: echo "Duplicate JRA odds run is paused; completed artifacts remain preserved."
