name: JRA licensed final odds and expected value (paused)

on:
  push:
    branches: [main]
    paths:
      - .github/jra-expected-value-request.json

permissions:
  contents: read

concurrency:
  group: jra-licensed-final-odds
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Keep duplicate JRA odds run paused
        run: echo "JRA odds and expected-value artifacts already completed successfully in run #1."
