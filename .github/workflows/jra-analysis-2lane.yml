name: JRA post-analysis two-lane

on:
  workflow_dispatch:
  schedule:
    # Monday 05:17 JST. Weekly run checks venue features only; ROI is on demand.
    - cron: "17 20 * * 0"
  push:
    branches: [main]
    paths:
      - .github/jra-analysis-2lane-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: jra-post-analysis-two-lane
  cancel-in-progress: true

jobs:
  analyze:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: ${{ fromJSON(github.event_name == 'schedule' && '["venue"]' || '["roi", "venue"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      ARCHIVE_OBJECT_PATH: "jra/2019-01-01_2026-09-18/jra-backfill-result.tar.gz"
      ARCHIVE_OUTPUT: ".dataset/jra-backfill-result.tar.gz"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate analysis scripts
        run: python -m py_compile scripts/jra_roi_analysis.py scripts/jra_venue_feature_analysis.py scripts/jra_condition_reference.py
      - name: Download durable JRA history from Supabase
        run: |
          mkdir -p .dataset
          bash scripts/download_supabase_archive.sh
      - name: Extract durable JRA history
        run: |
          tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
          test -s data/raw/jra/races-2019-2026.parquet
      - name: Build JRA condition and graded-race reference first
        if: matrix.lane == 'venue'
        run: |
          mkdir -p .jra-grades
          for year in {2019..2026}; do
            curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
              "https://www.jra.go.jp/datafile/seiseki/replay/${year}/jyusyo.html" \
              -o ".jra-grades/${year}.html"
          done
          python scripts/jra_condition_reference.py \
            --input data/raw/jra/races-2019-2026.parquet \
            --grade-dir .jra-grades \
            --output reports/jra-venue-features-v2/jra-condition-reference.json
      - name: Upload JRA condition reference first
        if: matrix.lane == 'venue'
        uses: actions/upload-artifact@v4
        with:
          name: jra-condition-reference-v1
          path: reports/jra-venue-features-v2/jra-condition-reference.json
          retention-days: 14
      - name: Download normalized final odds and payouts
        if: matrix.lane == 'roi'
        run: bash scripts/download_jra_normalized_from_supabase.sh .odds-normalized
      - name: ROI and expected-value analysis
        if: matrix.lane == 'roi'
        run: python scripts/jra_roi_analysis.py
      - name: Download saved real-odds REIN research models
        if: matrix.lane == 'roi'
        uses: actions/download-artifact@v4
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: .real-odds-model
          github-token: ${{ github.token }}
          run-id: "36135569462"
      - name: Audit non-trifecta tickets with saved real-odds REIN scores
        if: matrix.lane == 'roi'
        env:
          REIN_REAL_ODDS_TICKET_AUDIT: "1"
        run: python scripts/jra_roi_analysis.py
      - name: Venue and candidate-feature analysis
        if: matrix.lane == 'venue'
        run: python scripts/jra_venue_feature_analysis.py
      - name: Upload ROI report
        if: matrix.lane == 'roi'
        uses: actions/upload-artifact@v4
        with:
          name: jra-analysis-roi-ev
          path: |
            reports/jra-roi-ev-v1
            reports/rein-real-odds-ticket-audit
          retention-days: 14
      - name: Upload venue report
        if: matrix.lane == 'venue'
        uses: actions/upload-artifact@v4
        with:
          name: jra-analysis-venue-features
          path: reports/jra-venue-features-v2
          retention-days: 14
