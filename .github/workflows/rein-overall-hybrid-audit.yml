name: REIN overall hybrid audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/rein-overall-hybrid-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: .real-odds-model
          github-token: ${{ github.token }}
          run-id: "36135569462"
      - run: python scripts/rein_overall_hybrid_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rein-overall-hybrid-audit-20260925
          path: reports/rein-overall-hybrid
          retention-days: 30
