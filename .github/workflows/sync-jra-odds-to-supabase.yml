name: Sync JRA odds artifacts to Supabase

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Source jra-all-odds-backfill workflow run ID (blank = latest)"
        required: false
        type: string
  workflow_run:
    workflows: ["JRA all bet types odds and payouts backfill"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-jra-odds-to-supabase.yml"
      - "scripts/sync_jra_artifacts_to_supabase.sh"

permissions:
  actions: read
  contents: read

concurrency:
  group: sync-jra-odds-to-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: "https://dcewdzagnomcnvteokwj.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: "baken-archive"
      SOURCE_WORKFLOW_FILE: "jra-all-odds-backfill.yml"
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate archive credentials
        shell: bash
        run: |
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          fi

      - name: Upload completed chunks and verify checksums
        shell: bash
        run: bash scripts/sync_jra_artifacts_to_supabase.sh
