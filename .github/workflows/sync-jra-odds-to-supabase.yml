name: Sync JRA odds artifacts to Supabase

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Legacy source workflow run ID for manual recovery"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: sync-jra-odds-to-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_BROKER_URL: "https://dcewdzagnomcnvteokwj.supabase.co/functions/v1/github-jra-archive"
      SUPABASE_BUCKET: "baken-archive"
      SOURCE_WORKFLOW_FILE: "jra-all-odds-backfill.yml"
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload completed chunks and verify checksums
        shell: bash
        run: bash scripts/sync_jra_artifacts_to_supabase.sh
