name: Cancel superseded JRA all-odds run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-old-jra-all-odds.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel the superseded monthly run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/35490438174/force-cancel
