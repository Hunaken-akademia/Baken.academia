name: REIN top-three ranking quality

on:
  push:
    branches: [main]
    paths: [.github/rein-ranking-quality-request.json]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_ranking_quality -v
      - name: Download licensed JRA history
        uses: actions/download-artifact@v4
        with:
          name: jra-backfill-2019-2026
          path: .dataset
          github-token: ${{ github.token }}
          run-id: "35414533165"
      - run: tar --no-same-owner -xzf .dataset/jra-backfill-result.tar.gz
      - name: Download held-out REIN predictions
        uses: actions/download-artifact@v4
        with:
          name: jra-history-v2-model
          path: .model
          github-token: ${{ github.token }}
          run-id: "35417574150"
      - name: Evaluate ranking quality
        run: >-
          python -m baken_academia.ranking_quality
          --predictions .model/test_predictions.parquet
          --races data/raw/jra/races-2019-2026.parquet
          --output artifacts/rein-ranking-quality-v1
      - name: Publish summary
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/rein-ranking-quality-v1/report.json").read_text())
          period = report["periods"].get("test_2026", report["periods"]["all_held_out"])
          labels = {"rein": "REIN評価", "popularity": "人気順"}
          lines = [
              "## REIN評価トップ3 順位品質",
              "",
              "|方式|評価順位|1着率|2着以内率|3着以内率|平均着順|",
              "|---|---:|---:|---:|---:|---:|",
          ]
          for method, label in labels.items():
              for row in period[method]["by_evaluation_rank"]:
                  lines.append(
                      f"|{label}|{row['rank']}位|{row['win_rate']:.2%}|"
                      f"{row['top2_rate']:.2%}|{row['top3_rate']:.2%}|"
                      f"{row['average_finish']:.2f}|"
                  )
          lines.extend(["", "|方式|1位の1着率|1位の3着以内率|トップ3内に勝ち馬|トップ3から2頭以上3着内|トップ3全頭3着内|",
                        "|---|---:|---:|---:|---:|---:|"])
          for method, label in labels.items():
              row = period[method]["race_level"]
              lines.append(
                  f"|{label}|{row['top1_win_rate']:.2%}|{row['top1_top3_rate']:.2%}|"
                  f"{row['top3_contains_winner_rate']:.2%}|"
                  f"{row['top3_two_or_more_placed_rate']:.2%}|{row['top3_all_placed_rate']:.2%}|"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: rein-ranking-quality-v1
          path: artifacts/rein-ranking-quality-v1
          retention-days: 90
