name: REIN market-edge matched controls
on:
  push:
    branches: [analysis/jra-blend-top5-20260925]
    paths: [.github/workflows/rein-market-edge-controls.yml]
permissions:
  contents: read
  actions: read
jobs:
  control:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [first, second, third]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          path: .frozen-input
          github-token: ${{ github.token }}
          run-id: "36069608921"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1 lightgbm==4.7.0 scipy==1.17.1 scikit-learn==1.9.1
      - run: python -m unittest discover -s scripts -p test_rein_market_edge.py -v
      - name: Train matched controls on pre-2025 history only
        run: |
          mkdir -p .frozen
          tar --no-same-owner -xzf .frozen-input/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3.bundle.tar.gz -C .frozen
          python scripts/rein_market_edge_controls.py --bundle-root .frozen/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3 --role ${{ matrix.role }} --output artifacts/controls-${{ matrix.role }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rein-market-edge-controls-${{ matrix.role }}-20260925
          path: artifacts/controls-${{ matrix.role }}
          retention-days: 30
          if-no-files-found: warn
