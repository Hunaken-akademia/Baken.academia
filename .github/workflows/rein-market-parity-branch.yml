name: REIN market parity branch test
on:
  push:
    branches: [analysis/rein-market-parity-diagnostic-20260926]
    paths: [.github/workflows/rein-market-parity-branch.yml]
permissions:
  contents: read
  actions: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy==2.4.6 pandas==2.3.3 pyarrow==19.0.1 lightgbm==4.7.0 scipy==1.17.1 pyjwt==2.14.0 cryptography==50.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-saved-real-win-odds-training-20260925
          path: .models
          github-token: ${{ github.token }}
          run-id: '36135569462'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3
          path: .base
          github-token: ${{ github.token }}
          run-id: '36069608921'
      - name: Package candidate market models
        run: |
          set -euo pipefail
          mkdir -p rein-web/api/models/market_difference
          for role in first second third; do
            cp ".models/$role/real_odds_market.txt" "rein-web/api/models/market_difference/${role}_market.txt"
            cp ".models/$role/real_odds_without_people.txt" "rein-web/api/models/market_difference/${role}_rein.txt"
          done
      - name: Stage known market-only parity fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rein-web/api/rein_core.py')
          s=p.read_text()
          old='''        frame = full_frame.copy()
                  race_date = pd.Timestamp(race["race_date"])'''
          new='''        frame = full_frame.copy()
                  for column in CATEGORICAL:
                      if column in frame:
                          frame[column] = frame[column].astype(object)
                  race_date = pd.Timestamp(race["race_date"])'''
          if old in s:
              s=s.replace(old,new,1)
          old_style='''        history["_style_key"] = np.select(
                      [history["early_pct"].le(.25), history["early_pct"].le(.5), history["early_pct"].gt(.5)],
                      [1, 2, 3], default=0,
                  )'''
          new_style='''        historical_prior_early = history.groupby(
                      "horse_id", sort=False, observed=True
                  )["early_pct"].shift(1)
                  history["_style_key"] = np.select(
                      [historical_prior_early.le(.25), historical_prior_early.le(.5), historical_prior_early.gt(.5)],
                      [1, 2, 3], default=0,
                  )'''
          if old_style in s:
              s=s.replace(old_style,new_style,1)
          compile(s,str(p),'exec')
          p.write_text(s)
          PY
      - name: Test Top4 legacy-tail splice
        run: python scripts/finalize_market_top4.py
      - name: Download saved validation odds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .odds
          gh release download jra-final-odds-2019-2025-02-v1 --repo "$GITHUB_REPOSITORY" --pattern 'jra-final-odds-*.tar.gz' --dir .odds
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: jra-final-odds-*
          path: .odds
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: '35419708495'
      - name: Verify exact research/runtime parity
        run: |
          python scripts/verify_rein_market_runtime.py --bundle .base/rein-role-v4-189820badb8b7689b1da27435d2e2ba28c967fc3.bundle.tar.gz --research .models --odds .odds --output artifacts/runtime-parity
          cat artifacts/runtime-parity/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: branch-market-parity
          path: artifacts/runtime-parity
          retention-days: 7
