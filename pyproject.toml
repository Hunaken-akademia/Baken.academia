[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "baken-academia"
version = "0.1.0"
description = "Leakage-aware horse racing win-probability training pipeline"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "scikit-learn>=1.5,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
